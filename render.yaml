# Prepared deployment only. Adding this file DOES NOT create a Render service.
# Deploy only after authorizing Render's usage-based bill (minimum $1/month).
# GitHub schedule remains active until external scheduler has been verified.
services:
  - type: cron
    name: fx-exact-candle-scan
    runtime: python
    region: virginia
    plan: 0.5c-512mb
    repo: https://github.com/vincenzosorlando9-svg/fx-tradingview-scanner
    branch: main
    schedule: '2,17,32,47 * * * *'
    buildCommand: pip install -r requirements.txt beautifulsoup4
    startCommand: python fx_external_scan.py
    envVars:
      # Do NOT commit token to GitHub or share it in ChatGPT.
      # Fine-grained PAT with Contents: Read and write on this repo only.
      - key: GITHUB_WRITE_TOKEN
        sync: false
