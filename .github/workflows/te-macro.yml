name: Trading Economics Macro Snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * 0-5'
permissions:
  contents: write
concurrency:
  group: te-macro-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect permitted TE market data
        env:
          TE_API_KEY: ${{ secrets.TE_API_KEY }}
        run: python te_macro_collector.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx_macro_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Update TE macro market snapshot"
            git push
          fi
