name: Trading Economics Public KOSPI (Manual, No API Key)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: te-public-kospi-manual
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate KOSPI public webpage parser (no keys)
        run: python -m unittest -v test_fx_asian_risk
      - name: Refresh no-key public KOSPI context
        run: python fx_asian_risk_collector.py
      - name: Publish partial public Asian market context (not macro verification)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx_asian_risk.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Manually refresh public KOSPI context without API key"
          git pull --rebase origin main
          git push origin HEAD:main
