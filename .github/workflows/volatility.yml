
name: FX Volatility Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-volatility-scanner
  cancel-in-progress: false

jobs:
  update-volatility:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect ForexToolkits data
        run: python forextoolkits_collector.py

      - name: Commit volatility JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx_volatility.json
          if ! git diff --cached --quiet; then
            git commit -m "Update FX volatility readings"
            git push
          fi
