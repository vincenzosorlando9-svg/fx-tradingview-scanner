name: FX Early Rotation Detector

on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
    - cron: '5,20,35,50 * * * *'

permissions:
  contents: write

concurrency:
  group: fx-early-rotation
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FX_SCAN_CRON: ${{ github.event.schedule }}
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install primary and optional collector dependencies
        run: python -m pip install -r requirements.txt beautifulsoup4

      - name: Validate and collect the exact completed M15 M30 H1 candle slot with retries
        id: candle_slot
        continue-on-error: true
        run: |
          python -m unittest -v test_fx_exact_candle_gate
          python fx_github_slot.py collect

      - name: Collect current TradingView indicators
        if: steps.candle_slot.outputs.ready == 'true'
        run: |
          python scanner.py || { echo 'TradingView collector failed; retrying after 10 seconds'; sleep 10; python scanner.py; }

      - name: Generate conditional rotation signals
        if: steps.candle_slot.outputs.ready == 'true'
        run: python rotation_detector.py

      - name: Calculate daily and weekly NY-session levels
        if: steps.candle_slot.outputs.ready == 'true'
        run: python fx_daily_weekly_levels.py

      - name: Build consolidated FX dashboard
        if: steps.candle_slot.outputs.ready == 'true'
        run: python fx_dashboard.py

      - name: Replay directional reversals and keyless mobile notification safeguards
        if: steps.candle_slot.outputs.ready == 'true'
        run: python -m unittest -v test_fx_early_rotation test_fx_reversal_early test_fx_mobile_alerts test_fx_asian_risk test_fx_counter_rotation

      - name: Publish early directional rotation and JPY cluster warnings
        if: steps.candle_slot.outputs.ready == 'true'
        run: python fx_early_rotation.py

      - name: Persist first-observed CANONICAL direction after early overlay
        if: steps.candle_slot.outputs.ready == 'true'
        run: python fx_signal_history.py

      - name: Check approved news feeds for breaking central-bank headlines
        if: steps.candle_slot.outputs.ready == 'true'
        run: |
          python -m unittest -v test_fx_news_priority test_fx_approved_public_sources
          python fx_news_priority.py

      - name: Audit critical economic releases and central-bank speech schedules
        if: steps.candle_slot.outputs.ready == 'true'
        run: |
          python -m unittest -v test_fx_calendar_priority
          python fx_calendar_priority.py

      - name: Rebuild unified signal board against last verified macro snapshot
        if: steps.candle_slot.outputs.ready == 'true'
        run: python fx_signal_fusion_refresh.py

      - name: Enforce the locked FOREX MAIN SIGNAL 15-layer macro-first audit
        if: steps.candle_slot.outputs.ready == 'true'
        run: |
          python -m unittest -v test_fx_scan_report
          python fx_scan_report.py

      - name: Verify synchronized fresh output
        if: steps.candle_slot.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json, datetime, sys
          from pathlib import Path
          now=datetime.datetime.now(datetime.timezone.utc)
          d=json.loads(Path('fx_scan_dashboard.json').read_text())
          ts=datetime.datetime.fromisoformat(d['generated_at_utc'].replace('Z','+00:00'))
          age=(now-ts).total_seconds()/60
          assert -2 <= age <= 5, f'Dashboard generated timestamp is stale: {age:.1f} minutes'
          assert d.get('source_versions_match') is True, 'Input versions differ'
          assert len(d.get('pairs',[]))==11, 'Not all 11 pairs published'
          e=json.loads(Path('fx_early_rotation.json').read_text())
          assert len(e.get('pairs',[]))==11, 'Early engine did not evaluate all 11 pairs'
          assert e.get('generated_at_utc')==d.get('early_rotation_generated_at_utc'), 'Early and dashboard versions mismatch'
          assert all(x.get('execution_allowed') is False for x in e.get('pairs',[])), 'Non-executable early watch became an order'
          for p in d.get('pairs',[]):
              if p.get('early_direction_conflicts_with_legacy'):
                  assert p.get('canonical_direction')==p.get('direction'), 'Contradictory canonical directions'
              assert p.get('entry') is None and p.get('stop') is None, 'Watch gained fictitious entry/stop'
          for p in d['pairs']:
              frames=p.get('timeframes',{})
              assert all(t in frames for t in ('15m','30m','1H','4H','1D')), f"Missing timeframe for {p['pair']}"
              assert '5m' not in frames, f"5m signal timeframe unexpectedly present for {p['pair']}"
          report=json.loads(Path('fx_scan_report.json').read_text())
          expected=['report_header','top_five_published_ranking','current_currency_strength','critical_setups_omitted_from_top_five','fifteen_layer_macro_first_audit','full_15_layer_coverage_audit','final_forex_main_signal','layout_contract']
          assert list(report)==expected, 'User-approved fixed 15-layer report order changed'
          news=json.loads(Path('fx_news_priority.json').read_text())
          radar=json.loads(Path('fx_calendar_priority.json').read_text())
          assert len(radar['pairs']) == 11
          assert radar['no_orders_or_alerts'] and radar['no_directional_calendar_votes']
          assert radar['fxstreet_calendar_coverage'] == 'UNAVAILABLE_OAUTH_REQUIRED_NOT_INGESTED'
          assert all('scheduled_event_radar' in p for p in json.loads(Path('fx_unified_signals.json').read_text())['all_11'])
          assert len(news['pairs']) == 11
          assert news['no_headline_buy_sell_votes'] and news['no_trades_or_alerts']
          assert 'Newsquawk_public_delayed' in news['approved_source_names']
          assert news['Newsquawk_is_not_realtime_professional_feed'] is True
          assert 'FX Blue public calendar' in radar['approved_calendar_sources']
          assert radar['fx_blue_public_calendar_status']
          assert all('breaking_policy_news' in p for p in json.loads(Path('fx_unified_signals.json').read_text())['all_11'])
          assert report['layout_contract']['default_locked_until_user_explicitly_changes_it'] is True
          assert report['layout_contract']['do_not_simplify_to_six_sections'] is True
          assert report['layout_contract']['no_wrap_compact_rows'] is True
          assert report['layout_contract']['top_five_before_strength'] is True
          assert report['layout_contract']['display_direction_buy_green_short_red'] is True
          assert len(report['current_currency_strength']['top_five_compact'])==5
          assert all('&nbsp;' in r['compact_one_line'] for r in report['top_five_published_ranking']['rows'])
          assert all('&nbsp;' in r['compact_one_line'] for r in report['current_currency_strength']['top_five_compact'])
          assert all(r['compact_side']['color'] in ('green','red','neutral') for r in report['top_five_published_ranking']['rows'])
          md=Path('fx_scan_report.md').read_text()
          assert md.index('## 1. BEST 5 TRADING PAIRS') < md.index('## 2. CURRENCY STRENGTH')
          assert md.index('## 2. CURRENCY STRENGTH') < md.index('## 1. REUTERS AND FXSTREET')
          assert len(report['fifteen_layer_macro_first_audit'])==15, '15 macro-first layers missing'
          assert [v['layer'] for v in report['fifteen_layer_macro_first_audit']]==list(range(1,16))
          assert len(report['full_15_layer_coverage_audit'])==15
          assert len(report['fifteen_layer_macro_first_audit'][10]['pairs'])==11
          published=json.loads(Path('fx_unified_signals.json').read_text())['top_five']
          assert [p['pair'] for p in report['top_five_published_ranking']['rows']]==[p['pair'] for p in published]
          assert all(p['published_score']==s['technical_research_rank_score'] for p,s in zip(report['top_five_published_ranking']['rows'],published))
          assert Path('fx_scan_report.md').read_text().startswith('# FOREX MAIN SIGNAL — 15-LAYER MACRO-FIRST AUDIT')
          print('Complete user-approved 15-layer macro-first report layout verified')
          PY

      - name: Final exact candle and synchronized 15-layer report integrity gate
        id: final_gate
        if: steps.candle_slot.outputs.ready == 'true'
        run: python fx_github_slot.py finalize

      - name: Always record slot success, missing candles or delayed GitHub start
        id: slot_record
        if: always()
        env:
          PIPELINE_OUTCOME: ${{ steps.final_gate.outcome }}
        run: python fx_github_slot.py record

      - name: Commit successful signals OR health-only missed slot record
        if: always() && steps.slot_record.outcome == 'success'
        env:
          SIGNAL_PUBLICATION_ALLOWED: ${{ steps.slot_record.outputs.publish_signals }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$SIGNAL_PUBLICATION_ALLOWED" != "true" ]; then
            git restore -- fx_calendar_priority.json fx_news_priority.json fx_volatility.json fx_technicals.json fx_rotation_signals.json fx_scan_dashboard.json fx_daily_weekly_levels.json fx_signal_history.json fx_early_rotation.json fx_unified_signals.json fx_scan_report.json fx_scan_report.md
          else
            git add fx_calendar_priority.json fx_news_priority.json fx_volatility.json fx_technicals.json fx_rotation_signals.json fx_scan_dashboard.json fx_daily_weekly_levels.json fx_signal_history.json fx_early_rotation.json fx_unified_signals.json fx_scan_report.json fx_scan_report.md
          fi
          git add fx_scan_health.json fx_scan_slot_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Record four-slot FX scan and publish exact M15/M30/H1 data only when verified"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Verified FX scan/health publication committed"
                exit 0
              fi
              git rebase --abort || true
              sleep 4
            done
            echo "Unable to publish verified scan or health after retries"
            exit 1
          fi

      - name: Fail missed scheduled slots visibly after publishing health
        if: always() && github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          gate=json.loads(Path('fx_scan_gate.json').read_text())
          if gate['status']=='SKIP_ALREADY_VERIFIED':
              print('SCHEDULED_FX_SLOT_FINAL_STATUS: verified previous publication retained (no duplicate)')
              sys.exit(0)
          h=json.loads(Path('fx_scan_health.json').read_text())
          status=h['last_slot']['status']
          print('SCHEDULED_FX_SLOT_FINAL_STATUS:',status)
          if status not in ('FULL_REPORT_EXACT_CANDLES_VERIFIED','MARKET_CLOSED'):
              sys.exit('MISSED_OR_INCOMPLETE_SCHEDULED_FX_SLOT')
          PY
