name: FX Early Rotation Detector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'rotation_detector.py'
      - 'fx_dashboard.py'
      - 'fx_signal_history.py'
      - 'fx_early_rotation.py'
      - 'test_fx_early_rotation.py'
      - 'test_fx_reversal_early.py'
      - 'test_fx_mobile_alerts.py'
      - 'fx_mobile_alerts.py'
      - 'fx_reversal_replay_oct12.json'
      - 'fx_daily_weekly_levels.py'
      - 'forextoolkits_collector.py'
      - 'requirements.txt'
      - '.github/workflows/rotation.yml'
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: fx-early-rotation
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install primary and optional collector dependencies
        run: python -m pip install -r requirements.txt beautifulsoup4

      - name: Collect current ForexToolkits OHLC
        run: |
          python forextoolkits_collector.py || { echo 'ForexToolkits collector failed; retrying after 10 seconds'; sleep 10; python forextoolkits_collector.py; }

      - name: Collect current TradingView indicators
        run: |
          python scanner.py || { echo 'TradingView collector failed; retrying after 10 seconds'; sleep 10; python scanner.py; }

      - name: Generate conditional rotation signals
        run: python rotation_detector.py

      - name: Calculate daily and weekly NY-session levels
        run: python fx_daily_weekly_levels.py

      - name: Build consolidated FX dashboard
        run: python fx_dashboard.py

      - name: Replay directional reversals and keyless mobile notification safeguards
        run: python -m unittest -v test_fx_early_rotation test_fx_reversal_early test_fx_mobile_alerts

      - name: Publish early directional rotation and JPY cluster warnings
        run: python fx_early_rotation.py

      - name: Persist first-observed CANONICAL direction after early overlay
        run: python fx_signal_history.py

      - name: Verify synchronized fresh output
        run: |
          python - <<'PY'
          import json, datetime, sys
          from pathlib import Path
          now=datetime.datetime.now(datetime.timezone.utc)
          d=json.loads(Path('fx_scan_dashboard.json').read_text())
          ts=datetime.datetime.fromisoformat(d['generated_at_utc'].replace('Z','+00:00'))
          age=(now-ts).total_seconds()/60
          assert -2 <= age <= 5, f'Dashboard generated timestamp is stale: {age:.1f} minutes'
          assert d.get('source_versions_match') is True, 'Input versions differ'
          assert len(d.get('pairs',[]))==11, 'Not all 11 pairs published'
          e=json.loads(Path('fx_early_rotation.json').read_text())
          assert len(e.get('pairs',[]))==11, 'Early engine did not evaluate all 11 pairs'
          assert e.get('generated_at_utc')==d.get('early_rotation_generated_at_utc'), 'Early and dashboard versions mismatch'
          assert all(x.get('execution_allowed') is False for x in e.get('pairs',[])), 'Non-executable early watch became an order'
          for p in d.get('pairs',[]):
              if p.get('early_direction_conflicts_with_legacy'):
                  assert p.get('canonical_direction')==p.get('direction'), 'Contradictory canonical directions'
              assert p.get('entry') is None and p.get('stop') is None, 'Watch gained fictitious entry/stop'
          for p in d['pairs']:
              frames=p.get('timeframes',{})
              assert all(t in frames for t in ('15m','30m','1H','4H','1D')), f"Missing timeframe for {p['pair']}"
              assert '5m' not in frames, f"5m signal timeframe unexpectedly present for {p['pair']}"
          print('Dashboard structure validated; fresh individual candles remain separately gated by source_valid')
          PY

      - name: Publish new assigned GitHub Issue early alerts (NO external API key)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FX_ALERT_ASSIGNEE: vincenzosorlando9-svg
        run: python fx_mobile_alerts.py

      - name: Commit signal files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx_volatility.json fx_technicals.json fx_rotation_signals.json fx_scan_dashboard.json fx_daily_weekly_levels.json fx_signal_history.json fx_early_rotation.json fx_mobile_alert_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update synchronized FX technical dashboard with Daily and 4H"
            git pull --rebase origin main
            git push
          fi
