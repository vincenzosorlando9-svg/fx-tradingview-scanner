name: FX Early Rotation Detector

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: fx-early-rotation
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate conditional rotation signals
        run: python rotation_detector.py

      - name: Commit signal file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx_rotation_signals.json
          if ! git diff --cached --quiet; then
            git commit -m "Update FX early rotation candidates"
            git pull --rebase origin main
            git push
          fi
