name: Forex Factory market context (11 pairs)
on:
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *'
permissions:
  contents: write
concurrency:
  group: ff-market-context
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect publicly visible market context
        run: python3 collect_ff_markets.py
      - name: Publish supplementary market context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx_forexfactory_markets.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Forex Factory market context"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
