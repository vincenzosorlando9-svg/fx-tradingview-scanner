name: FX Macro Offline Regression CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fx_macro_collector.py'
      - 'fx_macro_engine.py'
      - 'fx_ff_actuals_collector.py'
      - 'fx_cftc_tff_collector.py'
      - 'fx_retail_collector.py'
      - 'fx_range_context.py'
      - 'fx_signal_fusion_refresh.py'
      - 'fx_news_priority.py'
      - 'test_fx_news_priority.py'
      - 'fx_calendar_priority.py'
      - 'test_fx_calendar_priority.py'
      - 'fx_approved_public_sources.py'
      - 'test_fx_approved_public_sources.py'
      - 'fx_exact_candle_gate.py'
      - 'test_fx_exact_candle_gate.py'
      - 'fx_github_slot.py'
      - 'test_fx_github_slot.py'
      - '.github/workflows/rotation.yml'
      - 'build_integrated_fx_audit.py'
      - 'test_fx_macro_engine.py'
      - 'fx_scan_report.py'
      - 'test_fx_scan_report.py'
      - '.github/workflows/fx-macro-ci.yml'

permissions:
  contents: read

concurrency:
  group: fx-macro-offline-ci
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout committed sources
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements.txt beautifulsoup4
      - name: Compile all macro and fast-fusion source files
        run: |
          python -m py_compile fx_macro_collector.py fx_macro_engine.py \
            fx_cftc_tff_collector.py fx_ff_actuals_collector.py \
            fx_range_context.py fx_signal_fusion_refresh.py fx_scan_report.py fx_news_priority.py fx_calendar_priority.py fx_approved_public_sources.py fx_exact_candle_gate.py fx_github_slot.py
      - name: Regression tests with synthetic source clocks (no HTTP)
        run: python -m unittest -v test_fx_macro_engine test_fx_scan_report test_fx_news_priority test_fx_calendar_priority test_fx_approved_public_sources test_fx_exact_candle_gate test_fx_github_slot
      - name: Confirm production ingestion schedule is push-disabled
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path(".github/workflows/fx-unified-macro.yml").read_text()
          triggers=s.partition("permissions:")[0]
          assert not re.search(r"^\s+push:",triggers,re.M)
          assert "schedule:" in triggers
          assert "FX_MACRO_NO_UNIFIED_WRITE" in s
          print("Scheduled-only ingestion, fast-board publication preserved")
          PY
