
name: Test ForexToolkits Volatility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-volatility:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test live volatility dashboard
        run: python forextoolkits_collector.py

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-volatility-diagnostic
          path: fx_volatility_diagnostic.json
          if-no-files-found: warn
